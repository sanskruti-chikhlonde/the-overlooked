<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMES | THE OVERLOOKED</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/frames.css">
</head>
<body>

<main class="frames-page">

<section class="frames-intro">
    <span class="section-label">THE COLLECTION</span>

    <h1>
        A world of images. <br>
        Waiting to be noticed.
    </h1>

    <p>
        Explore little details, unexpected perspectives,
        and beautiful moments hidden in everyday life.
    </p>
</section> 

<section class="gallery-section">

    <div class="gallery-heading">
        <span>EXPLORE THE COLLECTION</span>
        <span class="frames-count">00 FRAMES</span>
    </div>

    <div class="gallery-search">
    <input
        type="search"
        id="frame-search"
        placeholder="Search the collection..."
        aria-label="Search photographs"
    >
    </div>

    <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="structures">Structures</button>
        <button class="filter-btn" data-filter="details">Details</button>
        <button class="filter-btn" data-filter="still-life">Still Life</button>
        <button class="filter-btn" data-filter="portraits">Portraits</button>
        <button class="filter-btn" data-filter="atmosphere">Atmosphere</button>
    </div>

    <div class="frames-grid" id="frames-grid">
        <div class="frame-card" data-category="nature">
    <img src="" alt="Nature photograph">
    <span class="frame-caption">Nature</span>
</div>

<div class="frame-card" data-category="structures">
    <img src="" alt="Architecture photograph">
    <span class="frame-caption">Structures</span>
</div>

<div class="frame-card" data-category="details">
    <img src="" alt="Detail photograph">
    <span class="frame-caption">Details</span>
</div>

<div class="frame-card" data-category="still-life">
    <img src="" alt="Still life photograph">
    <span class="frame-caption">Still Life</span>
</div>

<div class="frame-card" data-category="portraits">
    <img src="" alt="Portrait photograph">
    <span class="frame-caption">portraits</span>
</div>

<div class="frame-card" data-category="atmosphere">
    <img src="" alt="Atmosphere photograph">
    <span class="frame-caption">Atmosphere</span>
</div>

</div>
</section>
</main> 

<script src="js/frames.js"></script>

</body>
</html>
