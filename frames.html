<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMES | THE OVERLOOKED</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/frames.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="site-header">
    <a href="index.html" class="logo">THE OVERLOOKED</a>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="unseen.html">UNSEEN</a>
        <a href="frames.html">FRAMES</a>
        <a href="keeps.html">KEEPS</a>
        <a href="perspective.html">PERSPECTIVE</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
        The World in Shadows
    </button>

    <button class="menu-toggle" type="button" aria-label="Open navigation">
        ☰
    </button>
</header>

<main class="frames-page">

<section class="frames-intro">

    <h1 class="frames-title">
        <span class="title-first">THE WORLD,</span>
        <span class="title-second">
            IN FRAMES<span class="title-period">.</span>
        </span>
    </h1>

</section>

<section class="gallery-section">

    <div class="gallery-heading">
        <span>EXPLORE THE COLLECTION</span>
    </div>

   <div class="gallery-controls">

    <!-- Search Area -->
    <div class="gallery-search">
        <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
        >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16 16 4 4"></path>
        </svg>

        <input
            type="search"
            id="frame-search"
            placeholder="Find something worth noticing..."
            aria-label="Search photographs"
        >
    </div>

    <!-- Category Navigation -->
    <div class="category-panel">

        <div class="category-panel-heading">
            <span>BROWSE BY SUBJECT</span>
            <span id="active-category-label">ALL FRAMES</span>
        </div>

        <div
            class="gallery-filters"
            role="group"
            aria-label="Filter photographs by category"
        >

            <button
                class="filter-btn active"
                type="button"
                data-filter="all"
                aria-pressed="true"
            >
                <span class="filter-btn-text">All</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="nature"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Nature</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="structures"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Structures</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="details"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Details</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="still-life"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Still Life</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="portraits"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Portraits</span>
                <span class="filter-btn-indicator"></span>
            </button>

            <button
                class="filter-btn"
                type="button"
                data-filter="atmosphere"
                aria-pressed="false"
            >
                <span class="filter-btn-text">Atmosphere</span>
                <span class="filter-btn-indicator"></span>
            </button>

        </div>
    </div>

</div>

<div class="frames-grid" id="frames-grid"></div>

<p class="no-results">No frames found.</p>

</section>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close image">&times;</button>

    <button class="lightbox-prev" aria-label="Previous image">
        &#10094;
    </button>

    <div class="lightbox-content">
        <img src="" alt="" id="lightbox-image">
        <p id="lightbox-caption"></p>
    </div>

    <button class="lightbox-next" aria-label="Next image">
        &#10095;
    </button>
</div>

</main> 

<footer class="site-footer">
    <a href="index.html" class="footer-logo">
        THE OVERLOOKED
    </a>
    <p>Things worth noticing.</p>
</footer>

<script src="js/main.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/frames.js"></script>

</body>
</html>
