<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMES | THE OVERLOOKED</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/frames.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="site-header">
    <a href="index.html" class="logo">THE OVERLOOKED</a>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="unseen.html">UNSEEN</a>
        <a href="frames.html">FRAMES</a>
        <a href="keeps.html">KEEPS</a>
        <a href="perspective.html">PERSPECTIVE</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
        The World in Shadows
    </button>

    <button class="menu-toggle" type="button" aria-label="Open navigation">
        ☰
    </button>
</header>

<main class="frames-page">

<section class="frames-intro">

    <h1 class="frames-title">
        <span class="title-first">THE WORLD,</span>
        <span class="title-second">
            IN FRAMES<span class="title-period">.</span>
        </span>
    </h1>

</section>

<section class="gallery-section">

    <div class="gallery-heading">
        <span>EXPLORE THE COLLECTION</span>
        <span class="frames-count">00 FRAMES</span>
    </div>

    <div class="gallery-search">
    <input
        type="search"
        id="frame-search"
        placeholder="Search the collection..."
        aria-label="Search photographs"
    >
    </div>

    <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="structures">Structures</button>
        <button class="filter-btn" data-filter="details">Details</button>
        <button class="filter-btn" data-filter="still-life">Still Life</button>
        <button class="filter-btn" data-filter="portraits">Portraits</button>
        <button class="filter-btn" data-filter="atmosphere">Atmosphere</button>
    </div>

<div class="frames-grid" id="frames-grid"></div>

<p class="no-results">No frames found.</p>

</section>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close image">&times;</button>

    <button class="lightbox-prev" aria-label="Previous image">
        &#10094;
    </button>

    <div class="lightbox-content">
        <img src="" alt="" id="lightbox-image">
        <p id="lightbox-caption"></p>
    </div>

    <button class="lightbox-next" aria-label="Next image">
        &#10095;
    </button>
</div>

</main> 

<footer class="site-footer">
    <a href="index.html" class="footer-logo">
        THE OVERLOOKED
    </a>
    <p>Things worth noticing.</p>
</footer>

<script src="js/main.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/frames.js"></script>

</body>
</html>
